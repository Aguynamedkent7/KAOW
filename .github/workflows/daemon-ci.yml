name: daemon-ci

on:
  push:
    branches: [main]
    paths: ["daemon/**", ".github/workflows/daemon-ci.yml"]
  pull_request:
    branches: [main]
    paths: ["daemon/**", ".github/workflows/daemon-ci.yml"]

jobs:
  test:
    name: Lint + Typecheck + Test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: daemon
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Set up Python
        run: uv python install 3.11

      - name: Sync dependencies
        run: uv sync --extra dev

      - name: Lint (ruff)
        run: uv run ruff check src/ tests/

      - name: Typecheck (mypy)
        run: uv run mypy src/

      - name: Test (pytest)
        run: uv run pytest tests/ -v